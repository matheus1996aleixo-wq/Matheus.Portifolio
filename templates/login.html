<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex items-center justify-center bg-[#0b0f19] text-gray-300 font-sans">
    <div class="max-w-md w-full mx-4 bg-[#111827] border border-gray-800 p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white mb-2">Painel Administrativo</h1>
            <p class="text-xs text-gray-400">Faça login para gerenciar seu portfólio</p>
        </div>

        {% if erro %}
        <div class="mb-4 p-3 bg-red-950/50 border border-red-800 text-red-400 text-xs rounded-xl text-center">
            {{ erro }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Usuário</label>
                <input type="text" name="username" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-400 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Senha</label>
                <input type="password" name="password" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-400 focus:outline-none transition">
            </div>
            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-gray-950 font-bold py-3 rounded-xl text-sm transition shadow-md">
                Entrar
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/" class="text-xs text-cyan-400 hover:underline">Voltar para o site</a>
        </div>
    </div>
</body>
</html>
