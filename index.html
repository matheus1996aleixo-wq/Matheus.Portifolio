<!DOCTYPE html>
<html lang="pt" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Portfólio | Matheus Aleixo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #94a3b8; font-family: 'Inter', sans-serif; }
        .card-glass { background: #111827; border: 1px solid #1f2937; box-shadow: 0 0 15px rgba(0, 255, 204, 0.05); }
        .glow-border:hover { border: 1px solid rgba(0, 242, 254, 0.5); box-shadow: 0 0 20px rgba(0, 242, 254, 0.2); transition: all 0.3s ease; }
        .nav-glass { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #1f2937; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        let currentLang = localStorage.getItem('site_lang') || 'pt';
        let siteData = {};

        async function loadPortfolioData() {
            try {
                const saved = localStorage.getItem('site_data');
                if (saved) {
                    siteData = JSON.parse(saved);
                    renderPortfolio();
                    checkAdminState();
                } else {
                    const response = await fetch('data.json');
                    siteData = await response.json();
                    localStorage.setItem('site_data', JSON.stringify(siteData));
                    renderPortfolio();
                    checkAdminState();
                }
            } catch (e) {
                console.error("Erro ao carregar o data.json:", e);
            }
        }

        function checkAdminState() {
            const isAdmin = localStorage.getItem('admin_logged') === 'true';
            const adminNavBtn = document.getElementById('admin-nav-btn');
            if (isAdmin && adminNavBtn) {
                adminNavBtn.innerHTML = '<i class="fa-solid fa-gauge mr-1"></i> PAINEL ADMIN';
                adminNavBtn.href = 'admin.html';
            }
        }

        function switchTab(tabId) {
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.classList.remove('text-cyan-400', 'border-b-2', 'border-cyan-400');
                link.classList.add('text-gray-400');
            });
            
            const targetTab = document.getElementById(tabId);
            if (targetTab) targetTab.classList.add('active');
            
            const activeLink = document.getElementById('link-' + tabId);
            if (activeLink) {
                activeLink.classList.remove('text-gray-400');
                activeLink.classList.add('text-cyan-400', 'border-b-2', 'border-cyan-400');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            
            document.querySelectorAll('.lang-btn-pt').forEach(btn => {
                btn.className = lang === 'pt' ? "px-3 py-1.5 rounded-full transition bg-cyan-500 text-gray-950 shadow-md lang-btn-pt" : "px-3 py-1.5 rounded-full transition text-gray-400 hover:text-white lang-btn-pt";
            });
            document.querySelectorAll('.lang-btn-en').forEach(btn => {
                btn.className = lang === 'en' ? "px-3 py-1.5 rounded-full transition bg-cyan-500 text-gray-950 shadow-md lang-btn-en" : "px-3 py-1.5 rounded-full transition text-gray-400 hover:text-white lang-btn-en";
            });

            renderPortfolio();
        }

        function toggleAccordion(elementId, iconId) {
            const content = document.getElementById(elementId);
            const icon = document.getElementById(iconId);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                if(icon) icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                if(icon) icon.style.transform = 'rotate(0deg)';
            }
        }

        // --- MODAL DE IMAGEM GENÉRICO ---
        function openImageModal(targetType, index, currentUrl) {
            document.getElementById('img_target_type').value = targetType;
            document.getElementById('img_target_idx').value = index;
            document.getElementById('img_url_input').value = currentUrl && !currentUrl.startsWith('data:') ? currentUrl : '';
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function saveGeneralImage() {
            const type = document.getElementById('img_target_type').value;
            const idx = document.getElementById('img_target_idx').value;
            let url = document.getElementById('img_url_input').value;
            const fileInput = document.getElementById('img_file_input');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    applyNewImage(type, idx, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                applyNewImage(type, idx, url);
            }
        }

        function applyNewImage(type, idx, newSrc) {
            if (type === 'profile') {
                if(siteData.profile) siteData.profile.foto = newSrc;
            } else if (type === 'skill') {
                if(siteData.skills && siteData.skills[idx]) siteData.skills[idx].icon = newSrc;
            } else if (type === 'project') {
                if(siteData.projects && siteData.projects[idx]) siteData.projects[idx].imagem = newSrc;
            } else if (type === 'module') {
                const parts = idx.split('_');
                const fIdx = parts[0];
                const materiaName = parts.slice(1).join('_');
                if (siteData.formations && siteData.formations[fIdx]) {
                    let desc = siteData.formations[fIdx].description || '';
                    let lines = desc.split('\n');
                    let newLines = lines.map(line => {
                        if (line.includes(':') && line.trim().startsWith(materiaName)) {
                            let baseLine = line.split('[icon:')[0].trim();
                            if (newSrc) {
                                return `${baseLine} [icon: ${newSrc}]`;
                            }
                            return baseLine;
                        }
                        return line;
                    });
                    siteData.formations[fIdx].description = newLines.join('\n');
                }
            }
            localStorage.setItem('site_data', JSON.stringify(siteData));
            renderPortfolio();
            closeImageModal();
        }

        // --- MODAL DE TEXTO GENÉRICO ---
        function openTextModal(targetType, index) {
            document.getElementById('txt_target_type').value = targetType;
            document.getElementById('txt_target_idx').value = index;
            
            const titleEl = document.getElementById('txt_modal_title_label');
            const descEl = document.getElementById('txt_modal_desc_label');
            const titleInput = document.getElementById('txt_input_title');
            const descInput = document.getElementById('txt_input_desc');

            if (targetType === 'profile_obj') {
                titleEl.innerText = "Título Profissional";
                descEl.innerText = "Sobre / Objetivo";
                titleInput.value = siteData.profile.titulo_pt || '';
                descInput.value = siteData.profile.sobre_pt || '';
            } else if (targetType === 'skill') {
                titleEl.innerText = "Categoria / Nome";
                descEl.innerText = "Conhecimento Detalhado";
                titleInput.value = siteData.skills[index].category || '';
                descInput.value = siteData.skills[index].detalhes || '';
            } else if (targetType === 'experience') {
                titleEl.innerText = "Cargo / Empresa";
                descEl.innerText = "Descrição da Experiência";
                titleInput.value = siteData.experiences[index].title || '';
                descInput.value = siteData.experiences[index].description || '';
            } else if (targetType === 'project') {
                titleEl.innerText = "Título do Projeto";
                descEl.innerText = "Descrição";
                titleInput.value = siteData.projects[index].title || '';
                descInput.value = siteData.projects[index].description || '';
            } else if (targetType === 'module') {
                const parts = index.split('_');
                const fIdx = parts[0];
                const matName = parts.slice(1).join('_');
                titleEl.innerText = "Título da Matéria";
                descEl.innerText = "Descrição / Capacitação";
                titleInput.value = matName;
                
                let descFound = '';
                const lines = siteData.formations[fIdx].description.split('\n');
                lines.forEach(l => {
                    if(l.includes(':') && l.trim().startsWith(matName)) {
                        let clean = l.split(':')[1].trim();
                        if(clean.includes('[icon:')) clean = clean.split('[icon:')[0].trim();
                        descFound = clean;
                    }
                });
                descInput.value = descFound;
            }

            document.getElementById('textModal').classList.remove('hidden');
        }

        function closeTextModal() {
            document.getElementById('textModal').classList.add('hidden');
        }

        function saveGeneralText() {
            const type = document.getElementById('txt_target_type').value;
            const idx = document.getElementById('txt_target_idx').value;
            const newTitle = document.getElementById('txt_input_title').value;
            const newDesc = document.getElementById('txt_input_desc').value;

            if (type === 'profile_obj') {
                siteData.profile.titulo_pt = newTitle;
                siteData.profile.sobre_pt = newDesc;
            } else if (type === 'skill') {
                siteData.skills[idx].category = newTitle;
                siteData.skills[idx].detalhes = newDesc;
            } else if (type === 'experience') {
                siteData.experiences[idx].title = newTitle;
                siteData.experiences[idx].description = newDesc;
            } else if (type === 'project') {
                siteData.projects[idx].title = newTitle;
                siteData.projects[idx].description = newDesc;
            } else if (type === 'module') {
                const parts = idx.split('_');
                const fIdx = parts[0];
                const oldMat = parts.slice(1).join('_');
                let desc = siteData.formations[fIdx].description || '';
                let lines = desc.split('\n');
                let newLines = lines.map(line => {
                    if (line.includes(':') && line.trim().startsWith(oldMat)) {
                        let iconPart = '';
                        if (line.includes('[icon:')) {
                            iconPart = ' [icon:' + line.split('[icon:')[1];
                        }
                        return `${newTitle}: ${newDesc}${iconPart}`;
                    }
                    return line;
                });
                siteData.formations[fIdx].description = newLines.join('\n');
            }
            localStorage.setItem('site_data', JSON.stringify(siteData));
            renderPortfolio();
            closeTextModal();
        }

        // --- EXCLUSÃO GENÉRICA ---
        function deleteItem(targetType, index) {
            if (confirm('Deseja realmente excluir este item?')) {
                if (targetType === 'skill') {
                    siteData.skills.splice(index, 1);
                } else if (targetType === 'experience') {
                    siteData.experiences.splice(index, 1);
                } else if (targetType === 'project') {
                    siteData.projects.splice(index, 1);
                } else if (targetType === 'module') {
                    const parts = index.split('_');
                    const fIdx = parts[0];
                    const matName = parts.slice(1).join('_');
                    let lines = siteData.formations[fIdx].description.split('\n');
                    let newLines = lines.filter(l => !(l.includes(':') && l.trim().startsWith(matName)));
                    siteData.formations[fIdx].description = newLines.join('\n');
                }
                localStorage.setItem('site_data', JSON.stringify(siteData));
                renderPortfolio();
            }
        }

        function renderPortfolio() {
            if (!siteData.profile) return;
            const p = siteData.profile;
            const isEn = (currentLang === 'en');
            const isAdmin = localStorage.getItem('admin_logged') === 'true';

            document.getElementById('page-title').innerText = `Portfólio | ${p.nome || 'Matheus Aleixo'}`;
            
            document.getElementById('nav-sobre').innerText = isEn ? 'Personal Info' : 'Informações Pessoais';
            document.getElementById('nav-formacao').innerText = isEn ? 'Formations & Courses' : 'Formações e Cursos';
            document.getElementById('nav-habilidades').innerText = isEn ? 'Skills' : 'Habilidades';
            document.getElementById('nav-experiencia').innerText = isEn ? 'Experiences' : 'Experiências';
            document.getElementById('nav-projetos').innerText = isEn ? 'Projects' : 'Projetos';

            const profileImgContainer = document.getElementById('profile-img-container');
            const profileFoto = p.foto || 'https://github.com/matheus1996aleixo-wq.png';
            let profileImgHtml = `<img src="${profileFoto}" alt="Perfil" class="w-full h-full object-cover">`;
            if (isAdmin) {
                profileImgHtml += `
                    <button onclick="openImageModal('profile', 0, '${profileFoto}')" class="absolute inset-0 bg-black/70 rounded-full flex items-center justify-center opacity-0 hover:opacity-100 transition text-cyan-400 text-sm font-bold" title="Editar Foto">
                        <i class="fa-solid fa-camera mr-1"></i> Foto
                    </button>`;
            }
            profileImgContainer.innerHTML = profileImgHtml;

            document.getElementById('profile-name').innerText = p.nome || 'Matheus Aleixo';
            document.getElementById('lbl-nascimento').innerText = isEn ? 'Date of Birth:' : 'Data de Nascimento:';
            document.getElementById('profile-nascimento').innerText = p.nascimento || '20/02/1996';
            
            document.getElementById('lbl-cidade').innerText = isEn ? 'City:' : 'Cidade:';
            document.getElementById('profile-cidade').innerText = isEn ? (p.cidade_en || p.cidade) : (p.cidade || 'Várzea Paulista');
            document.getElementById('lbl-estado').innerText = isEn ? 'State:' : 'Estado:';
            document.getElementById('profile-estado').innerText = isEn ? (p.estado_en || p.estado) : (p.estado || 'São Paulo (SP)');
            document.getElementById('lbl-pais').innerText = isEn ? 'Country:' : 'País:';
            document.getElementById('profile-pais').innerText = isEn ? (p.pais_en || p.pais) : (p.pais || 'Brasil');

            document.getElementById('lbl-idiomas').innerHTML = `<i class="fa-solid fa-language mr-1.5"></i> ${isEn ? 'Languages' : 'Idiomas'}`;
            const idiomasTexto = isEn ? (p.idiomas_en || p.idiomas_pt) : (p.idiomas_pt || 'Português: Nativo\nInglês: Intermediário / Técnico');
            let idiomasHtml = '';
            idiomasTexto.split('\n').forEach(linha => {
                if(linha.includes(':')) {
                    const partes = linha.split(':');
                    idiomasHtml += `<div class="flex justify-between items-center"><span class="text-gray-300 font-medium">${partes[0].trim()}:</span> <span class="text-gray-400">${partes[1].trim()}</span></div>`;
                } else {
                    idiomasHtml += `<div class="text-gray-400">${linha}</div>`;
                }
            });
            document.getElementById('idiomas-container').innerHTML = idiomasHtml;

            document.getElementById('lbl-disp').innerHTML = `<i class="fa-solid fa-briefcase mr-1.5"></i> ${isEn ? 'Availability to Work:' : 'Disponibilidade para Trabalhar:'}`;
            const dispTexto = isEn ? (p.disponibilidade_en || p.disponibilidade_pt) : (p.disponibilidade_pt || 'Home Office, Híbrido e Presencial');
            const dispLines = dispTexto.split('\n');
            document.getElementById('disp-main').innerText = dispLines[0];
            document.getElementById('disp-sub').innerHTML = dispLines.slice(1).join('<br>');

            // Renderização dinâmica dos botões de Currículo e Carta de Apresentação baseada no idioma selecionado
            const cvLink = isEn ? (p.curriculo_en || '') : (p.curriculo_pt || '');
            const clLink = isEn ? (p.carta_en || '') : (p.carta_pt || '');
            const cvLabel = isEn ? 'Download Resume' : 'Baixar Currículo';
            const clLabel = isEn ? 'Download Cover Letter' : 'Baixar Carta de Apresentação';

            let filesHtml = '';
            if (cvLink) {
                filesHtml += `<a href="${cvLink}" target="_blank" class="w-full text-center bg-cyan-500 hover:bg-cyan-600 text-gray-950 font-bold py-2.5 rounded-xl text-sm transition flex items-center justify-center"><i class="fa-solid fa-file-arrow-down mr-2"></i>${cvLabel}</a>`;
            }
            if (clLink) {
                filesHtml += `<a href="${clLink}" target="_blank" class="w-full text-center bg-gray-800 hover:bg-gray-700 text-cyan-400 border border-gray-700 font-bold py-2.5 rounded-xl text-sm transition flex items-center justify-center"><i class="fa-solid fa-envelope-open-text mr-2"></i>${clLabel}</a>`;
            }
            const docsSection = document.getElementById('profile-documents-section');
            if (docsSection) {
                docsSection.innerHTML = filesHtml;
            }

            document.getElementById('lbl-objetivo').innerText = isEn ? 'Professional Objectives' : 'Objetivos Profissionais';
            document.getElementById('profile-titulo').innerText = isEn ? (p.titulo_en || p.titulo_pt) : (p.titulo_pt || '');
            document.getElementById('profile-sobre').innerText = isEn ? (p.sobre_en || p.sobre_pt) : (p.sobre_pt || '');
            
            const profileEditBtn = document.getElementById('profile-edit-btn');
            if (isAdmin) {
                profileEditBtn.innerHTML = `<button onclick="openTextModal('profile_obj', 0)" class="bg-cyan-500/20 hover:bg-cyan-500 text-cyan-400 hover:text-gray-950 px-3 py-1 rounded-lg text-xs font-bold transition flex items-center"><i class="fa-solid fa-pen mr-1"></i> Editar Objetivo</button>`;
            } else {
                profileEditBtn.innerHTML = '';
            }

            document.getElementById('btn-linkedin').href = p.linkedin || '#';
            document.getElementById('btn-github').href = p.github || '#';

            document.getElementById('lbl-academico').innerText = isEn ? 'Academic Background' : 'Formação Acadêmica';
            document.getElementById('lbl-conclusao').innerText = isEn ? 'Completion Date:' : 'Data da Formação:';
            document.getElementById('profile-destaque-data').innerText = isEn ? (p.destaque_data_en || p.destaque_data) : (p.destaque_data || '');
            document.getElementById('profile-destaque-titulo').innerText = isEn ? (p.destaque_titulo_en || p.destaque_titulo_pt) : (p.destaque_titulo_pt || '');
            document.getElementById('lbl-universidade').innerText = isEn ? 'University:' : 'Universidade:';
            document.getElementById('profile-destaque-inst').innerText = isEn ? (p.destaque_inst_en || p.destaque_inst) : (p.destaque_inst || '');
            document.getElementById('lbl-competencias').innerHTML = `<i class="fa-solid fa-graduation-cap mr-1.5"></i> ${isEn ? 'Skills & Competencies acquired:' : 'Competências e Habilidades Adquiridas:'}`;
            document.getElementById('profile-destaque-comp').innerText = isEn ? (p.destaque_comp_en || p.destaque_comp_pt) : (p.destaque_comp_pt || '');
            document.getElementById('btn-mais-formacoes').innerHTML = `<i class="fa-solid fa-arrow-right mr-2"></i> ${isEn ? 'More Formations' : 'Mais Formações'}`;

            renderFormationsList();
            renderSkillsList();
            renderExperiencesList();
            renderProjectsList();
        }

        function renderFormationsList() {
            const container = document.getElementById('formations-section');
            const isEn = (currentLang === 'en');
            const isAdmin = localStorage.getItem('admin_logged') === 'true';
            
            let html = `<h2 class="text-3xl font-bold text-white mb-8 border-l-4 border-cyan-400 pl-4">${isEn ? 'Formations & Courses' : 'Formações e Cursos'}</h2>`;
            
            (siteData.formations || []).forEach((f, fIdx) => {
                const entityType = isEn ? (f.entity_type_en || f.entity_type) : f.entity_type;
                const level = isEn ? (f.level_en || f.level) : f.level;
                const course = isEn ? (f.course_en || f.course) : f.course;
                const entityName = isEn ? (f.entity_name_en || f.entity_name) : f.entity_name;
                const completionDate = isEn ? (f.completion_date_en || f.completion_date) : f.completion_date;
                const description = isEn ? (f.description_en || f.description) : f.description;

                html += `
                    <div class="card-glass p-8 rounded-3xl glow-border mb-10 relative">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-gray-800 pb-6 gap-4">
                            <div>
                                <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider block mb-1">
                                    <i class="fa-solid fa-graduation-cap mr-2"></i>${entityType}: ${level}
                                </span>
                                <h3 class="text-2xl font-bold text-white">${isEn ? 'Course:' : 'Curso:'} ${course}</h3>
                                <p class="text-gray-400 text-sm mt-1">${isEn ? 'Institution:' : 'Instituição:'} ${entityName}</p>
                            </div>
                            <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-800">
                                <p class="text-xs text-gray-400">${isEn ? 'Date:' : 'Data de Formação:'} <strong class="text-cyan-400">${completionDate}</strong></p>
                            </div>
                        </div>`;

                if (description) {
                    html += `
                        <h4 class="text-sm font-bold text-white uppercase tracking-wider mb-6 flex items-center">
                            <i class="fa-solid fa-layer-group text-cyan-400 mr-2"></i> ${isEn ? 'Modules, Knowledge & Skills:' : 'Matérias, Conhecimentos e Capacitações Adquiridas por Módulo:'}
                        </h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;

                    const lines = description.split('\n');
                    let modIndex = 0;
                    lines.forEach(linha => {
                        if (linha.includes(':')) {
                            modIndex++;
                            const partes = linha.split(':');
                            const materia = partes[0].trim();
                            const resto = partes.slice(1).join(':').trim();
                            
                            let desc = resto;
                            let iconUrl = '';
                            if (resto.includes('[icon:')) {
                                const restoSkip = resto.split('[icon:');
                                desc = restoSkip[0].trim();
                                iconUrl = restoSkip[1].replace(']', '').trim();
                            }

                            const modId = `mod-${fIdx}-${modIndex}`;
                            const iconId = `icon-mod-${fIdx}-${modIndex}`;

                            html += `
                                <div class="relative bg-gray-900/80 p-5 rounded-2xl border border-gray-800 hover:border-cyan-400 transition-all shadow-sm">
                                    ${isAdmin ? `
                                    <div class="absolute top-3 right-3 flex items-center space-x-1.5 z-10">
                                        <button onclick="openTextModal('module', '${fIdx}_${materia}')" class="bg-cyan-500/20 hover:bg-cyan-500 text-cyan-400 hover:text-gray-950 px-2 py-1 rounded-lg text-xs font-bold transition flex items-center" title="Editar Título e Descrição">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        <button onclick="deleteItem('module', '${fIdx}_${materia}')" class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white px-2 py-1 rounded-lg text-xs font-bold transition flex items-center" title="Excluir Módulo">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>` : ''}

                                    <div class="flex items-start space-x-4">
                                        <div class="relative group flex-shrink-0 mt-1">
                                            ${iconUrl ? `<img src="${iconUrl}" class="w-10 h-10 object-contain rounded">` : `<div class="w-10 h-10 rounded-xl bg-gray-800 flex items-center justify-center text-cyan-400"><i class="fa-solid fa-code"></i></div>`}
                                            
                                            ${isAdmin ? `
                                            <button onclick="openImageModal('module', '${fIdx}_${materia}', '${iconUrl}')" class="absolute inset-0 bg-black/70 rounded flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-cyan-400 text-xs" title="Editar Imagem">
                                                <i class="fa-solid fa-camera"></i>
                                            </button>` : ''}
                                        </div>

                                        <div class="flex-grow pr-16 cursor-pointer" onclick="toggleAccordion('${modId}', '${iconId}')">
                                            <div class="flex justify-between items-center">
                                                <h5 class="text-white font-bold text-base">${materia}</h5>
                                                <i id="${iconId}" class="fa-solid fa-chevron-down text-gray-400 text-xs transition-transform duration-300"></i>
                                            </div>
                                            <div id="${modId}" class="hidden mt-3 pt-3 border-t border-gray-800 text-xs text-gray-300 leading-relaxed">
                                                <strong class="text-cyan-300">${isEn ? 'Skills:' : 'Capacitação:'}</strong> ${desc}
                                            </div>
                                        </div>
                                    </div>
                                </div>`;
                        }
                    });

                    html += `</div>`;
                }

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function renderSkillsList() {
            const container = document.getElementById('skills-section');
            const isAdmin = localStorage.getItem('admin_logged') === 'true';
            container.innerHTML = `<h2 class="text-3xl font-bold text-white mb-10 border-l-4 border-cyan-400 pl-4">${currentLang === 'en' ? 'Skills Overview' : 'Resumo de Competências Técnicas e Habilidades'}</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="skills-grid"></div>`;
            
            const grid = document.getElementById('skills-grid');
            (siteData.skills || []).forEach((s, idx) => {
                const isEn = (currentLang === 'en');
                grid.innerHTML += `
                    <div class="card-glass p-6 rounded-2xl glow-border transition-all flex flex-col hover:border-cyan-400 relative">
                        ${isAdmin ? `
                        <div class="absolute top-3 right-3 flex items-center space-x-1 z-10">
                            <button onclick="openTextModal('skill', ${idx})" class="bg-cyan-500/20 hover:bg-cyan-500 text-cyan-400 hover:text-gray-950 px-2 py-1 rounded text-xs font-bold" title="Editar Texto"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteItem('skill', ${idx})" class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white px-2 py-1 rounded text-xs font-bold" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                        </div>` : ''}
                        
                        <div class="flex items-center justify-between pr-16 mb-4">
                            <div class="flex items-center space-x-4">
                                <div class="relative group w-16 h-16 rounded-xl bg-gray-900 flex items-center justify-center border border-gray-700 shadow-inner p-2 flex-shrink-0">
                                    ${s.icon ? `<img src="${s.icon}" class="w-10 h-10 object-contain">` : `<i class="fa-solid fa-bolt text-cyan-400 text-2xl"></i>`}
                                    ${isAdmin ? `
                                    <button onclick="openImageModal('skill', ${idx}, '${s.icon || ''}')" class="absolute inset-0 bg-black/70 rounded-xl flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-cyan-400 text-xs" title="Editar Ícone">
                                        <i class="fa-solid fa-camera"></i>
                                    </button>` : ''}
                                </div>
                                <div class="cursor-pointer" onclick="toggleAccordion('skill-${idx}', 'icon-skill-${idx}')">
                                    <h3 class="text-lg font-bold text-white">${isEn ? (s.category_en || s.category) : s.category}</h3>
                                    <p class="text-xs text-cyan-400 mt-1">${isEn ? (s.name_en || s.name) : s.name}</p>
                                </div>
                            </div>
                            <i id="icon-skill-${idx}" class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-300 cursor-pointer" onclick="toggleAccordion('skill-${idx}', 'icon-skill-${idx}')"></i>
                        </div>
                        <div id="skill-${idx}" class="hidden mt-2 pt-4 border-t border-gray-800 text-sm text-gray-300 leading-relaxed cursor-pointer" onclick="toggleAccordion('skill-${idx}', 'icon-skill-${idx}')">
                            <p><strong class="text-cyan-400">${isEn ? 'Detailed Knowledge:' : 'Conhecimento Detalhado:'}</strong> ${isEn ? (s.detalhes_en || s.detalhes) : s.detalhes}</p>
                        </div>
                    </div>`;
            });
        }

        function renderExperiencesList() {
            const container = document.getElementById('experiences-section');
            const isAdmin = localStorage.getItem('admin_logged') === 'true';
            container.innerHTML = `<h2 class="text-3xl font-bold text-white mb-10 border-l-4 border-cyan-400 pl-4">${currentLang === 'en' ? 'Professional Experiences' : 'Experiências Profissionais'}</h2><div class="max-w-4xl mx-auto border-l-2 border-gray-800 ml-4 md:ml-8 space-y-10" id="exp-timeline"></div>`;
            
            const timeline = document.getElementById('exp-timeline');
            (siteData.experiences || []).forEach((e, idx) => {
                const isEn = (currentLang === 'en');
                timeline.innerHTML += `
                    <div class="relative pl-8 md:pl-12">
                        <div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full bg-cyan-500 shadow-[0_0_10px_rgba(0,255,204,0.8)] border-2 border-gray-950"></div>
                        <div class="card-glass p-6 rounded-2xl glow-border transition-all hover:bg-gray-800/50 relative">
                            ${isAdmin ? `
                            <div class="absolute top-3 right-3 flex items-center space-x-1 z-10">
                                <button onclick="openTextModal('experience', ${idx})" class="bg-cyan-500/20 hover:bg-cyan-500 text-cyan-400 hover:text-gray-950 px-2 py-1 rounded text-xs font-bold" title="Editar Texto"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteItem('experience', ${idx})" class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white px-2 py-1 rounded text-xs font-bold" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                            </div>` : ''}
                            
                            <div class="cursor-pointer" onclick="toggleAccordion('exp-${idx}', 'icon-exp-${idx}')">
                                <div class="flex flex-col md:flex-row justify-between md:items-start mb-2 gap-2 pr-16">
                                    <div><h3 class="text-xl font-bold text-white">${isEn ? (e.title_en || e.title) : e.title}</h3></div>
                                    <div class="flex items-center gap-4">
                                        <span class="inline-block bg-gray-900 border border-gray-700 text-cyan-400 text-xs px-3 py-1.5 rounded-full font-bold whitespace-nowrap"><i class="fa-regular fa-calendar mr-1"></i> ${isEn ? (e.period_en || e.period) : e.period}</span>
                                        <i id="icon-exp-${idx}" class="fa-solid fa-chevron-down text-cyan-400 transition-transform duration-300"></i>
                                    </div>
                                </div>
                                <div id="exp-${idx}" class="hidden mt-4 pt-4 border-t border-gray-800">
                                    <p class="text-sm text-gray-300 leading-relaxed">${isEn ? (e.description_en || e.description) : e.description}</p>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function renderProjectsList() {
            const container = document.getElementById('projects-section');
            const isAdmin = localStorage.getItem('admin_logged') === 'true';
            container.innerHTML = `<h2 class="text-3xl font-bold text-white mb-10 border-l-4 border-cyan-400 pl-4">${currentLang === 'en' ? 'Developed Projects' : 'Projetos Desenvolvidos'}</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="projects-grid"></div>`;
            
            const grid = document.getElementById('projects-grid');
            (siteData.projects || []).forEach((p, idx) => {
                const isEn = (currentLang === 'en');
                const techs = isEn ? (p.tech_en || p.tech) : p.tech;
                let tagsHtml = '';
                if(techs) {
                    techs.split(',').forEach(t => { tagsHtml += `<span class="text-xs bg-gray-800 border border-gray-700 text-cyan-300 px-3 py-1 rounded-full">${t.trim()}</span>`; });
                }
                
                const projImg = p.imagem || '';
                
                grid.innerHTML += `
                    <div class="card-glass rounded-2xl overflow-hidden glow-border flex flex-col relative">
                        ${isAdmin ? `
                        <div class="absolute top-3 right-3 flex items-center space-x-1 z-20">
                            <button onclick="openTextModal('project', ${idx})" class="bg-cyan-500/20 hover:bg-cyan-500 text-cyan-400 hover:text-gray-950 px-2.5 py-1 rounded-lg text-xs font-bold" title="Editar Texto"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteItem('project', ${idx})" class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                        </div>` : ''}

                        <div class="relative group h-40 bg-gray-900 flex items-center justify-center border-b border-gray-800">
                            ${projImg ? `<img src="${projImg}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-rocket text-4xl text-cyan-400"></i>`}
                            ${isAdmin ? `
                            <button onclick="openImageModal('project', ${idx}, '${projImg}')" class="absolute inset-0 bg-black/70 flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-cyan-400 text-xs font-bold" title="Editar Imagem do Projeto">
                                <i class="fa-solid fa-camera mr-1"></i> Alterar Imagem
                            </button>` : ''}
                        </div>

                        <div class="p-6 flex flex-col flex-grow">
                            <h3 class="text-xl font-bold text-white mb-2">${isEn ? (p.title_en || p.title) : p.title}</h3>
                            <p class="text-sm text-gray-400 mb-4 leading-relaxed whitespace-pre-line">${isEn ? (p.description_en || p.description) : p.description}</p>
                            <div class="flex flex-wrap gap-2 mb-6">${tagsHtml}</div>
                            <div class="flex gap-4 mt-auto">
                                ${p.link_github ? `<a href="${p.link_github}" target="_blank" class="w-full text-center bg-gray-800 hover:bg-gray-700 text-white font-bold py-2.5 rounded-xl text-sm border border-gray-700 transition"><i class="fa-brands fa-github mr-2"></i>GitHub</a>` : ''}
                                ${p.link_live ? `<a href="${p.link_live}" target="_blank" class="w-full text-center bg-cyan-500 hover:bg-cyan-600 text-gray-950 font-bold py-2.5 rounded-xl text-sm transition"><i class="fa-solid fa-globe mr-2"></i>Online</a>` : ''}
                            </div>
                        </div>
                    </div>`;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadPortfolioData();
        });
    </script>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-white">

    <header class="fixed top-0 w-full z-50 nav-glass">

            <nav class="flex items-center space-x-6 md:space-x-8 text-sm font-semibold overflow-x-auto w-full md:w-auto scrollbar-hide pb-2 md:pb-0">

                <button onclick="switchTab('formacao')" id="link-formacao" class="nav-link whitespace-nowrap text-gray-400 hover:text-cyan-400 pb-1 transition"><span id="nav-formacao">Formações e Cursos</span></button>
                <button onclick="switchTab('habilidades')" id="link-habilidades" class="nav-link whitespace-nowrap text-gray-400 hover:text-cyan-400 pb-1 transition"><span id="nav-habilidades">Habilidades</span></button>
                <button onclick="switchTab('experiencia')" id="link-experiencia" class="nav-link whitespace-nowrap text-gray-400 hover:text-cyan-400 pb-1 transition"><span id="nav-experiencia">Experiências</span></button>
                <button onclick="switchTab('projetos')" id="link-projetos" class="nav-link whitespace-nowrap text-gray-400 hover:text-cyan-400 pb-1 transition"><span id="nav-projetos">Projetos</span></button>

            <div class="hidden md:flex items-center space-x-4">

                    <button onclick="setLang('en')" class="px-3 py-1.5 rounded-full transition text-gray-400 hover:text-white lang-btn-en">EN</button>
                </div>
                <a id="admin-nav-btn" href="login.html" class="border border-cyan-400 text-cyan-400 px-5 py-2 rounded-full hover:bg-cyan-400 hover:text-gray-900 transition text-sm font-bold shadow-[0_0_10px_rgba(0,255,204,0.3)]">ADMIN</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-36 pb-12">
        
        <!-- INFORMAÇÕES PESSOAIS -->
        <div id="sobre" class="tab-content active">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start mb-16">
                <!-- Coluna Esquerda: Informações Pessoais -->
                <div class="card-glass p-8 rounded-3xl glow-border text-center relative">
                    <div id="profile-img-container" class="relative group w-32 h-32 mx-auto bg-gray-800 rounded-full border-4 border-cyan-400 mb-6 flex items-center justify-center overflow-hidden shadow-[0_0_15px_rgba(0,255,204,0.4)]">

                    </div>
                    <h1 id="profile-name" class="text-2xl font-bold text-white mb-2"></h1>
                    <p class="text-xs text-gray-400 mb-6"><span id="lbl-nascimento">Data de Nascimento:</span> <strong id="profile-nascimento" class="text-gray-200"></strong></p>

                            <a id="btn-github" href="#" target="_blank" class="bg-gray-800 hover:bg-gray-700 text-white border border-gray-700 px-5 py-2.5 rounded-xl text-sm font-bold transition"><i class="fa-brands fa-github mr-2"></i>GitHub</a>

                    </div>
                </div>

                <input type="hidden" id="img_target_type">
                <input type="hidden" id="img_target_idx">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Link da Imagem</label>

                </div>
            </div>
        </div>
    </div>
