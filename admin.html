<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Matheus Aleixo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #94a3b8; font-family: 'Inter', sans-serif; }
        .card-glass { background: #111827; border: 1px solid #1f2937; box-shadow: 0 0 15px rgba(0, 255, 204, 0.05); }
        .glow-border:focus-within { border-color: rgba(0, 242, 254, 0.5); box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
    <script>
        if(localStorage.getItem('admin_logged') !== 'true') {
            window.location.href = 'login.html';
        }

        let siteData = {};

        async function loadAdminData() {
            try {
                const response = await fetch('data.json');
                siteData = await response.json();
                populateAll();
            } catch (e) {
                alert("Erro ao carregar o data.json. Certifique-se de que o arquivo está na mesma pasta.");
            }
        }

        function populateAll() {
            if (!siteData.profile) return;
            const p = siteData.profile;

            // Perfil
            document.getElementById('nome').value = p.nome || '';
            document.getElementById('nascimento').value = p.nascimento || '';
            document.getElementById('foto_url').value = p.foto || '';
            document.getElementById('cidade').value = p.cidade || '';
            document.getElementById('cidade_en').value = p.cidade_en || '';
            document.getElementById('estado').value = p.estado || '';
            document.getElementById('estado_en').value = p.estado_en || '';
            document.getElementById('pais').value = p.pais || '';
            document.getElementById('pais_en').value = p.pais_en || '';
            document.getElementById('linkedin').value = p.linkedin || '';
            document.getElementById('github').value = p.github || '';
            document.getElementById('titulo_pt').value = p.titulo_pt || '';
            document.getElementById('titulo_en').value = p.titulo_en || '';
            document.getElementById('sobre_pt').value = p.sobre_pt || '';
            document.getElementById('sobre_en').value = p.sobre_en || '';
            document.getElementById('disponibilidade_pt').value = p.disponibilidade_pt || '';
            document.getElementById('disponibilidade_en').value = p.disponibilidade_en || '';
            document.getElementById('idiomas_pt').value = p.idiomas_pt || '';
            document.getElementById('idiomas_en').value = p.idiomas_en || '';
            document.getElementById('destaque_data').value = p.destaque_data || '';
            document.getElementById('destaque_data_en').value = p.destaque_data_en || '';
            document.getElementById('destaque_inst').value = p.destaque_inst || '';
            document.getElementById('destaque_inst_en').value = p.destaque_inst_en || '';
            document.getElementById('destaque_titulo_pt').value = p.destaque_titulo_pt || '';
            document.getElementById('destaque_titulo_en').value = p.destaque_titulo_en || '';
            document.getElementById('destaque_comp_pt').value = p.destaque_comp_pt || '';
            document.getElementById('destaque_comp_en').value = p.destaque_comp_en || '';

            renderFormations();
            renderSkills();
            renderExperiences();
            renderProjects();
        }

        function downloadJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(siteData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            alert("data.json atualizado gerado com sucesso! Substitua-o na raiz do seu projeto.");
        }

        function saveProfile(e) {
            e.preventDefault();
            siteData.profile.nome = document.getElementById('nome').value;
            siteData.profile.nascimento = document.getElementById('nascimento').value;
            siteData.profile.foto = document.getElementById('foto_url').value;
            siteData.profile.cidade = document.getElementById('cidade').value;
            siteData.profile.cidade_en = document.getElementById('cidade_en').value;
            siteData.profile.estado = document.getElementById('estado').value;
            siteData.profile.estado_en = document.getElementById('estado_en').value;
            siteData.profile.pais = document.getElementById('pais').value;
            siteData.profile.pais_en = document.getElementById('pais_en').value;
            siteData.profile.linkedin = document.getElementById('linkedin').value;
            siteData.profile.github = document.getElementById('github').value;
            siteData.profile.titulo_pt = document.getElementById('titulo_pt').value;
            siteData.profile.titulo_en = document.getElementById('titulo_en').value;
            siteData.profile.sobre_pt = document.getElementById('sobre_pt').value;
            siteData.profile.sobre_en = document.getElementById('sobre_en').value;
            siteData.profile.disponibilidade_pt = document.getElementById('disponibilidade_pt').value;
            siteData.profile.disponibilidade_en = document.getElementById('disponibilidade_en').value;
            siteData.profile.idiomas_pt = document.getElementById('idiomas_pt').value;
            siteData.profile.idiomas_en = document.getElementById('idiomas_en').value;
            siteData.profile.destaque_data = document.getElementById('destaque_data').value;
            siteData.profile.destaque_data_en = document.getElementById('destaque_data_en').value;
            siteData.profile.destaque_inst = document.getElementById('destaque_inst').value;
            siteData.profile.destaque_inst_en = document.getElementById('destaque_inst_en').value;
            siteData.profile.destaque_titulo_pt = document.getElementById('destaque_titulo_pt').value;
            siteData.profile.destaque_titulo_en = document.getElementById('destaque_titulo_en').value;
            siteData.profile.destaque_comp_pt = document.getElementById('destaque_comp_pt').value;
            siteData.profile.destaque_comp_en = document.getElementById('destaque_comp_en').value;
            downloadJson();
        }

        // Renderizadores de Listas (Formações, Habilidades, Experiências, Projetos)
        function renderFormations() {
            const container = document.getElementById('formations-list');
            container.innerHTML = '';
            (siteData.formations || []).forEach((f, idx) => {
                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <h4 class="text-white font-bold">${f.course}</h4>
                            <p class="text-xs text-gray-400">${f.entity_name} - ${f.completion_date}</p>
                        </div>
                        <button onclick="deleteItem('formations', ${idx})" class="text-red-500 hover:text-red-400 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
            });
        }

        function addFormation(e) {
            e.preventDefault();
            if(!siteData.formations) siteData.formations = [];
            siteData.formations.push({
                id: Date.now().toString(),
                level: document.getElementById('f_level').value,
                level_en: document.getElementById('f_level_en').value,
                course: document.getElementById('f_course').value,
                course_en: document.getElementById('f_course_en').value,
                entity_type: document.getElementById('f_type').value,
                entity_type_en: document.getElementById('f_type_en').value,
                entity_name: document.getElementById('f_name').value,
                entity_name_en: document.getElementById('f_name_en').value,
                completion_date: document.getElementById('f_date').value,
                completion_date_en: document.getElementById('f_date_en').value,
                description: document.getElementById('f_desc').value,
                description_en: document.getElementById('f_desc_en').value
            });
            downloadJson();
            populateAll();
        }

        function renderSkills() {
            const container = document.getElementById('skills-list');
            container.innerHTML = '';
            (siteData.skills || []).forEach((s, idx) => {
                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <h4 class="text-white font-bold">${s.category}</h4>
                            <p class="text-xs text-gray-400">${s.name}</p>
                        </div>
                        <button onclick="deleteItem('skills', ${idx})" class="text-red-500 hover:text-red-400 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
            });
        }

        function addSkill(e) {
            e.preventDefault();
            if(!siteData.skills) siteData.skills = [];
            siteData.skills.push({
                id: Date.now().toString(),
                category: document.getElementById('s_cat').value,
                category_en: document.getElementById('s_cat_en').value,
                name: document.getElementById('s_name').value,
                name_en: document.getElementById('s_name_en').value,
                icon: document.getElementById('s_icon').value,
                detalhes: document.getElementById('s_det').value,
                detalhes_en: document.getElementById('s_det_en').value
            });
            downloadJson();
            populateAll();
        }

        function renderExperiences() {
            const container = document.getElementById('experiences-list');
            container.innerHTML = '';
            (siteData.experiences || []).forEach((ex, idx) => {
                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <h4 class="text-white font-bold">${ex.title}</h4>
                            <p class="text-xs text-gray-400">${ex.period}</p>
                        </div>
                        <button onclick="deleteItem('experiences', ${idx})" class="text-red-500 hover:text-red-400 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
            });
        }

        function addExperience(e) {
            e.preventDefault();
            if(!siteData.experiences) siteData.experiences = [];
            siteData.experiences.push({
                id: Date.now().toString(),
                title: document.getElementById('ex_title').value,
                title_en: document.getElementById('ex_title_en').value,
                period: document.getElementById('ex_period').value,
                period_en: document.getElementById('ex_period_en').value,
                description: document.getElementById('ex_desc').value,
                description_en: document.getElementById('ex_desc_en').value
            });
            downloadJson();
            populateAll();
        }

        function renderProjects() {
            const container = document.getElementById('projects-list');
            container.innerHTML = '';
            (siteData.projects || []).forEach((pr, idx) => {
                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <h4 class="text-white font-bold">${pr.title}</h4>
                            <p class="text-xs text-cyan-400">${pr.tech}</p>
                        </div>
                        <button onclick="deleteItem('projects', ${idx})" class="text-red-500 hover:text-red-400 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
            });
        }

        function addProject(e) {
            e.preventDefault();
            if(!siteData.projects) siteData.projects = [];
            siteData.projects.push({
                id: Date.now().toString(),
                title: document.getElementById('pr_title').value,
                title_en: document.getElementById('pr_title_en').value,
                tech: document.getElementById('pr_tech').value,
                tech_en: document.getElementById('pr_tech_en').value,
                link_github: document.getElementById('pr_github').value,
                link_live: document.getElementById('pr_live').value,
                description: document.getElementById('pr_desc').value,
                description_en: document.getElementById('pr_desc_en').value
            });
            downloadJson();
            populateAll();
        }

        function deleteItem(arrayName, index) {
            if(confirm("Deseja realmente remover este item?")) {
                siteData[arrayName].splice(index, 1);
                downloadJson();
                populateAll();
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-cyan-500', 'text-gray-950');
                link.classList.add('bg-gray-800', 'text-cyan-400');
            });
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.remove('bg-gray-800', 'text-cyan-400');
            document.getElementById('btn-' + tabId).classList.add('bg-cyan-500', 'text-gray-950');
        }

        function logout() {
            localStorage.removeItem('admin_logged');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-white pb-20">

    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-code-branch text-cyan-400 text-2xl"></i>
                <span class="text-xl font-bold text-white tracking-wider">PAINEL ADMIN</span>
            </div>
            <div class="space-x-4 flex items-center">
                <a href="index.html" class="text-cyan-400 text-sm font-bold hover:underline"><i class="fa-solid fa-eye mr-2"></i>Ver Site</a>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-bold transition"><i class="fa-solid fa-power-off mr-2"></i>Sair</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-10">
        <div class="flex flex-wrap gap-4 mb-10">
            <button id="btn-perfil" onclick="switchTab('perfil')" class="nav-link active bg-cyan-500 text-gray-950 px-5 py-2 rounded-xl font-bold text-sm transition">Informações Pessoais</button>
            <button id="btn-formacao" onclick="switchTab('formacao')" class="nav-link bg-gray-800 text-cyan-400 border border-gray-700 px-5 py-2 rounded-xl font-bold text-sm transition">Formações</button>
            <button id="btn-habilidades" onclick="switchTab('habilidades')" class="nav-link bg-gray-800 text-cyan-400 border border-gray-700 px-5 py-2 rounded-xl font-bold text-sm transition">Habilidades</button>
            <button id="btn-experiencias" onclick="switchTab('experiencias')" class="nav-link bg-gray-800 text-cyan-400 border border-gray-700 px-5 py-2 rounded-xl font-bold text-sm transition">Experiências</button>
            <button id="btn-projetos" onclick="switchTab('projetos')" class="nav-link bg-gray-800 text-cyan-400 border border-gray-700 px-5 py-2 rounded-xl font-bold text-sm transition">Projetos</button>
        </div>

        <!-- PERFIL -->
        <div id="perfil" class="tab-content active">
            <div class="card-glass p-8 rounded-3xl mb-8">
                <h2 class="text-2xl font-bold text-white mb-6 border-l-4 border-cyan-400 pl-4">Editar Toda Página Inicial</h2>
                <form onsubmit="saveProfile(event)" class="space-y-4">
                    <h3 class="text-cyan-400 font-bold border-b border-gray-700 pb-2 mt-6">Dados Pessoais</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs text-gray-400 mb-1">Nome Completo</label><input type="text" id="nome" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Data Nascimento</label><input type="text" id="nascimento" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs text-gray-400 mb-1">URL Foto Perfil</label><input type="text" id="foto_url" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs text-gray-400 mb-1">Cidade (PT)</label><input type="text" id="cidade" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Cidade (EN)</label><input type="text" id="cidade_en" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Estado (PT)</label><input type="text" id="estado" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Estado (EN)</label><input type="text" id="estado_en" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">País (PT)</label><input type="text" id="pais" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">País (EN)</label><input type="text" id="pais_en" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs text-gray-400 mb-1">URL LinkedIn</label><input type="text" id="linkedin" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">URL GitHub</label><input type="text" id="github" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                    </div>

                    <h3 class="text-cyan-400 font-bold border-b border-gray-700 pb-2 mt-8">Resumo Profissional</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs text-gray-400 mb-1">Título (PT)</label><input type="text" id="titulo_pt" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Título (EN)</label><input type="text" id="titulo_en" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Sobre (PT)</label><textarea id="sobre_pt" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></textarea></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Sobre (EN)</label><textarea id="sobre_en" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></textarea></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Disponibilidade (PT)</label><textarea id="disponibilidade_pt" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></textarea></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Disponibilidade (EN)</label><textarea id="disponibilidade_en" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></textarea></div>
                    </div>

                    <h3 class="text-cyan-400 font-bold border-b border-gray-700 pb-2 mt-8">Idiomas</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs text-gray-400 mb-1">Idiomas (PT)</label><textarea id="idiomas_pt" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></textarea></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Idiomas (EN)</label><textarea id="idiomas_en" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></textarea></div>
                    </div>

                    <h3 class="text-cyan-400 font-bold border-b border-gray-700 pb-2 mt-8">Formação em Destaque</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs text-gray-400 mb-1">Data Conclusão (PT)</label><input type="text" id="destaque_data" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Data Conclusão (EN)</label><input type="text" id="destaque_data_en" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Instituição (PT)</label><input type="text" id="destaque_inst" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Instituição (EN)</label><input type="text" id="destaque_inst_en" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Título Formação (PT)</label><input type="text" id="destaque_titulo_pt" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Título Formação (EN)</label><input type="text" id="destaque_titulo_en" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Competências (PT)</label><textarea id="destaque_comp_pt" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></textarea></div>
                        <div><label class="block text-xs text-gray-400 mb-1">Competências (EN)</label><textarea id="destaque_comp_en" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm glow-border focus:outline-none"></textarea></div>
                    </div>

                    <div class="pt-6"><button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-gray-950 font-bold py-4 px-6 rounded-xl transition text-sm text-center">Salvar Informações</button></div>
                </form>
            </div>
        </div>

        <!-- FORMAÇÕES -->
        <div id="formacao" class="tab-content">
            <div class="card-glass p-8 rounded-3xl mb-8">
                <h2 class="text-2xl font-bold text-white mb-6 border-l-4 border-cyan-400 pl-4">Adicionar Formação</h2>
                <form onsubmit="addFormation(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="f_level" placeholder="Nível PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="f_level_en" placeholder="Nível EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="f_course" placeholder="Curso PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="f_course_en" placeholder="Curso EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="f_type" placeholder="Tipo PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="f_type_en" placeholder="Tipo EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="f_name" placeholder="Instituição PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="f_name_en" placeholder="Instituição EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="f_date" placeholder="Data PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="f_date_en" placeholder="Data EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                    </div>
                    <textarea id="f_desc" rows="3" placeholder="Descrição PT..." required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm"></textarea>
                    <textarea id="f_desc_en" rows="3" placeholder="Descrição EN..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm"></textarea>
                    <button type="submit" class="bg-cyan-500 hover:bg-cyan-600 text-gray-950 font-bold py-3 px-6 rounded-xl text-sm">Adicionar Formação</button>
                </form>
            </div>
            <div id="formations-list" class="space-y-4"></div>
        </div>

        <!-- HABILIDADES -->
        <div id="habilidades" class="tab-content">
            <div class="card-glass p-8 rounded-3xl mb-8">
                <h2 class="text-2xl font-bold text-white mb-6 border-l-4 border-cyan-400 pl-4">Adicionar Habilidade</h2>
                <form onsubmit="addSkill(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="s_cat" placeholder="Categoria PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="s_cat_en" placeholder="Categoria EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="s_name" placeholder="Título PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="s_name_en" placeholder="Título EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                    </div>
                    <input type="text" id="s_icon" placeholder="Link da Imagem/Ícone (Opcional)" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                    <textarea id="s_det" rows="2" placeholder="Detalhes PT..." required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm"></textarea>
                    <textarea id="s_det_en" rows="2" placeholder="Detalhes EN..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm"></textarea>
                    <button type="submit" class="bg-cyan-500 hover:bg-cyan-600 text-gray-950 font-bold py-3 px-6 rounded-xl text-sm">Adicionar Habilidade</button>
                </form>
            </div>
            <div id="skills-list" class="space-y-4"></div>
        </div>

        <!-- EXPERIÊNCIAS -->
        <div id="experiencias" class="tab-content">
            <div class="card-glass p-8 rounded-3xl mb-8">
                <h2 class="text-2xl font-bold text-white mb-6 border-l-4 border-cyan-400 pl-4">Adicionar Experiência</h2>
                <form onsubmit="addExperience(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="ex_title" placeholder="Cargo e Empresa PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="ex_title_en" placeholder="Cargo e Empresa EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="ex_period" placeholder="Período PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="ex_period_en" placeholder="Período EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                    </div>
                    <textarea id="ex_desc" rows="3" placeholder="Descrição PT..." required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm"></textarea>
                    <textarea id="ex_desc_en" rows="3" placeholder="Descrição EN..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm"></textarea>
                    <button type="submit" class="bg-cyan-500 hover:bg-cyan-600 text-gray-950 font-bold py-3 px-6 rounded-xl text-sm">Adicionar Experiência</button>
                </form>
            </div>
            <div id="experiences-list" class="space-y-4"></div>
        </div>

        <!-- PROJETOS -->
        <div id="projetos" class="tab-content">
            <div class="card-glass p-8 rounded-3xl mb-8">
                <h2 class="text-2xl font-bold text-white mb-6 border-l-4 border-cyan-400 pl-4">Adicionar Projeto</h2>
                <form onsubmit="addProject(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="pr_title" placeholder="Título PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="pr_title_en" placeholder="Título EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="pr_tech" placeholder="Tecnologias PT" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="pr_tech_en" placeholder="Tecnologias EN" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="pr_github" placeholder="Link GitHub" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                        <input type="text" id="pr_live" placeholder="Link Online" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm">
                    </div>
                    <textarea id="pr_desc" rows="3" placeholder="Descrição PT..." required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm"></textarea>
                    <textarea id="pr_desc_en" rows="3" placeholder="Descrição EN..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm"></textarea>
                    <button type="submit" class="bg-cyan-500 hover:bg-cyan-600 text-gray-950 font-bold py-3 px-6 rounded-xl text-sm">Adicionar Projeto</button>
                </form>
            </div>
            <div id="projects-list" class="space-y-4"></div>
        </div>

    </main>
</body>
</html>
